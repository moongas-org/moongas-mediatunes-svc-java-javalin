plugins {
    // Apply the application plugin to add support for building a CLI application in Java.
    id 'java'
    id 'application'
}

repositories {
    // Use Maven Central for resolving dependencies.
    mavenCentral()
}

dependencies {
    // Core Javalin framework
    implementation 'io.javalin:javalin:6.7.0'

    // Javalin requires an SLF4J implementation for logging
    implementation 'org.slf4j:slf4j-simple:2.0.16'

    // Optional: Jackson dependency for auto-converting objects to JSON
    implementation 'com.fasterxml.jackson.core:jackson-databind:2.17.0'

    // YAML configuration file parsing (mediatunes-config.yml)
    implementation 'org.yaml:snakeyaml:2.5'

    // SQLite database (mediascan.db)
    implementation 'org.xerial:sqlite-jdbc:3.53.2.0'

    // Unit + endpoint tests
    testImplementation 'io.javalin:javalin-testtools:6.7.0'
    testImplementation 'com.squareup.okhttp3:okhttp:4.12.0'
}

testing {
    suites {
        // Configure the built-in test suite
        test {
            // Use JUnit Jupiter test framework
            useJUnitJupiter('6.0.1')
        }
    }
}

// Apply a specific Java toolchain to ease working on different environments.
java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(25)
    }
}

tasks.withType(JavaCompile) {
    options.encoding = 'UTF-8'
}

application {
    applicationDefaultJvmArgs = ['-Dfile.encoding=UTF-8', '-Dstdout.encoding=UTF-8', '-Dstderr.encoding=UTF-8']
    // Define the main class for the application.
    mainClass = 'org.moongas.server.MoonGasServer'
}
