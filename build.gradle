// Common setup shared by ALL child projects (app and core)
subprojects {
    apply plugin: 'java' // Registers standard Java compilation tasks

    group = 'org.moongas'
    version = '1.0.0'

    java {
        // Automatically manages and enforces the required JDK version
        toolchain {
            languageVersion = JavaLanguageVersion.of(25)
        }
    }

    repositories {
        mavenCentral() // Downloads external dependencies from Maven Central
    }

    testing {
        suites {
            // Configure the built-in test suite
            test {
                // Use JUnit Jupiter test framework
                useJUnitJupiter('6.0.1')
            }
        }
    }
}